<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#79B5D9">
  <title>Family Center PWA Test</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box} body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#79B5D9;color:#17212b}
    main{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0002}
    h1{margin:0 0 6px} button,input{font:inherit;border-radius:10px;padding:12px}button{border:0;background:#1769aa;color:white;font-weight:700;margin:4px}
    input{width:100%;border:1px solid #bbb;margin:6px 0}.ok{color:#137333}.bad{color:#a50e0e}.muted{color:#5f6368}
    video{width:100%;background:#111;border-radius:12px;max-height:360px;display:none}.row{display:flex;gap:8px;flex-wrap:wrap}
    code{word-break:break-all}.status{padding:10px;border-radius:10px;background:#f3f4f6;margin-top:8px}
  </style>
</head>
<body>
<main>
  <h1>Hardman Family Center</h1>
  <div class="muted">PWA / Camera / Apps Script connection test</div>

  <section class="card">
    <h2>1. Secure context</h2>
    <div id="secureStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>2. Camera</h2>
    <video id="video" playsinline muted></video>
    <div class="row">
      <button onclick="startCamera()">Start Camera</button>
      <button onclick="stopCamera()">Stop Camera</button>
    </div>
    <div id="cameraStatus" class="status">Not tested.</div>
  </section>

  <section class="card">
    <h2>3. Apps Script API</h2>
    <div class="muted">Paste the deployed Apps Script <b>/exec</b> URL here. It is saved only in this browser.</div>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="row">
      <button onclick="saveApiUrl()">Save URL</button>
      <button onclick="testApi()">Test API</button>
    </div>
    <div id="apiStatus" class="status">Not tested.</div>
  </section>

  <section class="card">
    <h2>4. Barcode support</h2>
    <div id="barcodeStatus" class="status"></div>
  </section>
</main>
<script>
let stream=null;
const $=id=>document.getElementById(id);

function setStatus(id,msg,ok){
  const el=$(id); el.textContent=msg; el.className='status '+(ok===true?'ok':ok===false?'bad':'');
}
function boot(){
  setStatus('secureStatus',
    window.isSecureContext ? 'PASS — this page is a secure context.' : 'FAIL — HTTPS is required for camera access.',
    window.isSecureContext);
  const supported='BarcodeDetector' in window;
  setStatus('barcodeStatus',
    supported ? 'BarcodeDetector is available in this browser.' : 'BarcodeDetector is not available. Camera can still work; we can add a JavaScript barcode decoder in the full build.',
    supported ? true : null);
  $('apiUrl').value=localStorage.getItem('familyCenterApiUrl')||'';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('getUserMedia is unavailable.');
    stopCamera();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('video'); v.srcObject=stream; await v.play(); v.style.display='block';
    const t=stream.getVideoTracks()[0];
    setStatus('cameraStatus','PASS — camera opened'+(t?.label?' ('+t.label+')':'')+'.',true);
  }catch(e){ setStatus('cameraStatus','FAIL — '+(e?.name?e.name+': ':'')+(e?.message||e),false); }
}
function stopCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; const v=$('video'); v.srcObject=null; v.style.display='none';
}
function saveApiUrl(){
  const u=$('apiUrl').value.trim();
  localStorage.setItem('familyCenterApiUrl',u);
  setStatus('apiStatus','API URL saved on this device.',true);
}
async function testApi(){
  const u=$('apiUrl').value.trim();
  if(!u){setStatus('apiStatus','Paste the Apps Script /exec URL first.',false);return;}
  saveApiUrl();
  setStatus('apiStatus','Testing…');
  try{
    const sep=u.includes('?')?'&':'?';
    const r=await fetch(u+sep+'api=ping&ts='+Date.now(),{method:'GET',redirect:'follow',cache:'no-store'});
    const text=await r.text();
    let data; try{data=JSON.parse(text)}catch{throw new Error('Expected JSON but received: '+text.slice(0,120));}
    if(!data.success) throw new Error(data.error||'API returned success=false');
    setStatus('apiStatus','PASS — Apps Script replied: '+(data.message||'pong'),true);
  }catch(e){setStatus('apiStatus','FAIL — '+(e?.message||e),false);}
}
boot();
</script>
</body>
</html>
